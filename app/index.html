<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>DiveWatch</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg:        #0d0f12;
    --bg-card:   #181c22;
    --bg-elev:   #21262e;
    --border:    #2a2f37;
    --text:      #f0f0f2;
    --text-dim:  #8a8f99;
    --text-mute: #5a5f68;
    --orange:    #ff7a3a;
    --green:     #34c759;
    --red:       #ff453a;
    --blue:      #5ac8fa;
    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC",
                 "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    overscroll-behavior: none;
  }
  .app {
    max-width: 520px; margin: 0 auto;
    padding: 24px 18px 96px;
  }
  /* ============ 顶部品牌 ============ */
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px 22px;
  }
  .brand-name {
    font-size: 22px; font-weight: 600; letter-spacing: -0.4px;
  }
  .brand-name span { color: var(--orange); }
  .conn-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 8px;
    background: var(--bg-elev); border-radius: 999px;
    font-size: 12px; color: var(--text-dim);
  }
  .conn-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-mute);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .conn-pill.online .conn-dot {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .conn-pill.busy .conn-dot {
    background: var(--orange); animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.35; }
  }

  /* ============ Section ============ */
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--text-mute); text-transform: uppercase;
    margin: 0 4px 10px;
  }

  /* ============ 状态网格 ============ */
  .stat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .stat-card {
    background: var(--bg-card); border-radius: var(--r-md);
    padding: 14px 12px;
    border: 1px solid transparent;
  }
  .stat-card .label {
    font-size: 11px; color: var(--text-mute);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-size: 20px; font-weight: 600; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .value.dim { color: var(--text-mute); font-size: 14px; }

  /* ============ 卡片 ============ */
  .card {
    background: var(--bg-card); border-radius: var(--r-md);
    padding: 16px;
    border: 1px solid transparent;
  }
  .card + .card { margin-top: 10px; }
  .card-title {
    font-size: 14px; font-weight: 600;
    margin: 0 0 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title small {
    color: var(--text-mute); font-weight: 400; font-size: 12px;
  }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; font-size: 12px; color: var(--text-dim);
    margin-bottom: 6px;
  }
  .input, .select {
    width: 100%; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    color: var(--text); padding: 11px 13px;
    font-size: 14px; font-family: inherit;
    outline: none; transition: border-color 0.15s;
  }
  .input:focus, .select:focus { border-color: var(--orange); }
  .input::placeholder { color: var(--text-mute); }

  /* ============ 按钮 ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 11px 16px; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: var(--orange); color: #0a0a0a;
    border-color: var(--orange);
  }
  .btn.danger {
    background: transparent; color: var(--red); border-color: var(--red);
  }
  .btn.ghost {
    background: transparent; border-color: var(--border);
  }
  .btn.block { width: 100%; }
  .btn-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 4px;
  }
  .btn-row.three { grid-template-columns: 1fr 1fr 1fr; }

  /* ============ 进度条 ============ */
  .progress {
    margin: 10px 0 6px;
    background: var(--bg-elev); height: 6px; border-radius: 4px;
    overflow: hidden;
  }
  .progress > div {
    background: var(--orange); height: 100%; width: 0%;
    transition: width 0.2s ease;
  }
  .progress-text {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ============ 文件 input ============ */
  .file-input { position: relative; overflow: hidden; }
  .file-input input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .file-name {
    color: var(--text-dim); font-size: 12px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ============ 日志 ============ */
  .log {
    background: #06080a; border-radius: var(--r-sm);
    padding: 10px 12px; max-height: 160px; overflow-y: auto;
    font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 11.5px; line-height: 1.55; color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .log .ok    { color: var(--green); }
  .log .err   { color: var(--red); }
  .log .info  { color: var(--blue); }
  .log .warn  { color: var(--orange); }

  /* ============ Toast ============ */
  .toast-host {
    position: fixed; left: 0; right: 0; bottom: 28px;
    display: flex; justify-content: center; pointer-events: none; z-index: 100;
  }
  .toast {
    background: var(--bg-elev); border: 1px solid var(--border);
    color: var(--text); padding: 11px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 500; max-width: 80%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok  { border-color: var(--green); color: var(--green); }

  /* 隐藏 */
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <!-- 顶部品牌 -->
  <div class="brand">
    <div class="brand-name">Dive<span>Watch</span></div>
    <div id="connPill" class="conn-pill">
      <span class="conn-dot"></span>
      <span id="connText">未连接</span>
    </div>
  </div>

  <!-- 状态网格 -->
  <div class="section">
    <div class="section-title">设备状态</div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">电池</div>
        <div id="statBat" class="value dim">—</div>
      </div>
      <div class="stat-card">
        <div class="label">WiFi</div>
        <div id="statWifi" class="value dim">—</div>
      </div>
      <div class="stat-card">
        <div class="label">IP</div>
        <div id="statIp" class="value dim">—</div>
      </div>
    </div>
  </div>

  <!-- 连接 -->
  <div class="section">
    <div class="section-title">连接</div>
    <div class="card">
      <div class="card-title">蓝牙
        <small>需在设备上进入 OTA 模式</small>
      </div>
      <div class="btn-row">
        <button id="btnConnect" class="btn primary block">扫描连接</button>
        <button id="btnDisconnect" class="btn ghost block" disabled>断开</button>
      </div>
    </div>
  </div>

  <!-- WiFi -->
  <div class="section">
    <div class="section-title">WiFi 配置</div>
    <div class="card">
      <div class="field">
        <label>SSID</label>
        <input id="inpSsid" class="input" type="text" placeholder="网络名称" autocomplete="off">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="inpPsk" class="input" type="password" placeholder="WiFi 密码" autocomplete="off">
      </div>
      <div class="btn-row three">
        <button id="btnWifiConnect" class="btn primary" disabled>连接</button>
        <button id="btnWifiForget" class="btn ghost" disabled>清除</button>
        <button id="btnReboot" class="btn ghost" disabled>重启</button>
      </div>
    </div>
  </div>

  <!-- OTA -->
  <div class="section">
    <div class="section-title">固件升级 (WiFi)</div>
    <div class="card">
      <div class="field">
        <label>设备 IP</label>
        <input id="inpIp" class="input" type="text" placeholder="设备连上 WiFi 后会自动填" autocomplete="off">
      </div>
      <div class="field">
        <label>固件 .bin</label>
        <button class="btn block file-input">
          <span id="fileLabel">选择文件…</span>
          <input id="inpFile" type="file" accept=".bin">
        </button>
        <div id="fileName" class="file-name"></div>
      </div>
      <div class="progress"><div id="otaBar"></div></div>
      <div class="progress-text">
        <span id="otaPctText">0%</span>
        <span id="otaSizeText">—</span>
      </div>
      <button id="btnOtaPush" class="btn primary block" style="margin-top:12px" disabled>
        推送固件
      </button>
    </div>
  </div>

  <!-- 日志 -->
  <div class="section">
    <div class="section-title">日志</div>
    <div class="card">
      <div id="logBox" class="log"></div>
      <button id="btnLogClear" class="btn ghost block" style="margin-top:10px">清空</button>
    </div>
  </div>

  <p style="text-align:center;color:var(--text-mute);font-size:11px;margin:32px 0 0">
    Web Bluetooth · Chrome / Edge (Android / 桌面) · iOS 用 Bluefy
  </p>
</div>

<div class="toast-host"><div id="toast" class="toast"></div></div>

<script>
// ============ BLE UUIDs (匹配 ota_ble.ino) ============
const SVC  = "1d14d6ee-fd63-4fa1-bfa4-8f47b42119f0";
const SSID = "f7bf3564-fb6d-4e53-88a4-5e37e0326063";
const PSK  = "984227f3-34fc-4045-a5d0-2c581f81a153";
const CMD  = "0c533cef-d6b0-4ba2-9f08-7d6cea1b3e7e";
const STAT = "3b1f9c5e-8a72-4d11-9b3a-7c4e2f1a5d80";

// ============ State ============
const S = {
  device: null, server: null,
  chSsid: null, chPsk: null, chCmd: null, chStat: null,
  ip: "", batPct: null, wifiOk: false,
  otaFile: null,
};

// ============ DOM helpers ============
const $ = (id) => document.getElementById(id);
const dom = {
  connPill: $("connPill"), connText: $("connText"),
  statBat: $("statBat"), statWifi: $("statWifi"), statIp: $("statIp"),
  btnConnect: $("btnConnect"), btnDisconnect: $("btnDisconnect"),
  inpSsid: $("inpSsid"), inpPsk: $("inpPsk"),
  btnWifiConnect: $("btnWifiConnect"), btnWifiForget: $("btnWifiForget"),
  btnReboot: $("btnReboot"),
  inpIp: $("inpIp"), inpFile: $("inpFile"),
  fileName: $("fileName"), fileLabel: $("fileLabel"),
  otaBar: $("otaBar"), otaPctText: $("otaPctText"), otaSizeText: $("otaSizeText"),
  btnOtaPush: $("btnOtaPush"),
  logBox: $("logBox"), btnLogClear: $("btnLogClear"),
  toast: $("toast"),
};

// ============ Log + Toast ============
function log(msg, type) {
  const line = document.createElement("div");
  if (type) line.className = type;
  const t = new Date().toLocaleTimeString("zh-CN", { hour12:false });
  line.textContent = `[${t}] ${msg}`;
  dom.logBox.appendChild(line);
  dom.logBox.scrollTop = dom.logBox.scrollHeight;
}
let toastTimer;
function toast(msg, type) {
  dom.toast.textContent = msg;
  dom.toast.className = "toast show " + (type || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => dom.toast.className = "toast", 2400);
}

// ============ UI sync ============
function setConn(state, text) {
  // state: offline | busy | online
  dom.connPill.className = "conn-pill " + (state === "offline" ? "" : state);
  dom.connText.textContent = text;
  const online = (state === "online");
  dom.btnDisconnect.disabled = !online;
  dom.btnConnect.disabled = (state === "busy");
  dom.btnConnect.textContent = online ? "已连接" : "扫描连接";
  for (const id of ["btnWifiConnect","btnWifiForget","btnReboot"]) {
    $(id).disabled = !online;
  }
  updateOtaBtn();
}
function updateOtaBtn() {
  dom.btnOtaPush.disabled = !(S.otaFile && dom.inpIp.value.trim().length);
}

// ============ BLE connect ============
async function connect() {
  if (!navigator.bluetooth) {
    toast("浏览器不支持 Web Bluetooth", "err");
    log("navigator.bluetooth 不可用", "err");
    return;
  }
  try {
    setConn("busy", "扫描中…");
    log("请求蓝牙设备…", "info");
    S.device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "DiveWatch" }],
      optionalServices: [SVC],
    });
    log("已选择设备: " + S.device.name);
    S.device.addEventListener("gattserverdisconnected", onDisconnect);
    setConn("busy", "连接中…");
    S.server = await S.device.gatt.connect();
    log("GATT 连接成功, 拉取服务…");
    const svc = await S.server.getPrimaryService(SVC);
    [S.chSsid, S.chPsk, S.chCmd, S.chStat] = await Promise.all([
      svc.getCharacteristic(SSID), svc.getCharacteristic(PSK),
      svc.getCharacteristic(CMD),  svc.getCharacteristic(STAT),
    ]);
    await S.chStat.startNotifications();
    S.chStat.addEventListener("characteristicvaluechanged", onStat);
    setConn("online", "已连接");
    log("订阅 STAT, 等待状态…", "ok");
    toast("已连接", "ok");
  } catch (e) {
    setConn("offline", "未连接");
    log("连接失败: " + e.message, "err");
    toast("连接失败", "err");
  }
}
function onDisconnect() {
  setConn("offline", "未连接");
  log("设备已断开", "warn");
  toast("设备已断开");
}
async function disconnect() {
  try { if (S.device?.gatt?.connected) S.device.gatt.disconnect(); }
  catch (e) {}
}

// ============ STAT notify handler ============
const dec = new TextDecoder();
function onStat(ev) {
  const txt = dec.decode(ev.target.value).trim();
  log("STAT: " + txt);
  // 解析常见消息
  // 例: "WIFI_OK 192.168.1.50"  "WIFI_FAIL"  "OTA_PROGRESS 45"  "INFO bat=83 ip=..."
  const m = txt.match(/^WIFI_OK\s+([\d.]+)/);
  if (m) {
    S.ip = m[1]; S.wifiOk = true;
    dom.statIp.textContent = S.ip;
    dom.statIp.classList.remove("dim");
    dom.statWifi.textContent = "已连"; dom.statWifi.classList.remove("dim");
    dom.statWifi.style.color = "var(--green)";
    dom.inpIp.value = S.ip;
    updateOtaBtn();
    toast("WiFi 已连 " + S.ip, "ok");
    return;
  }
  if (txt.startsWith("WIFI_FAIL")) {
    S.wifiOk = false;
    dom.statWifi.textContent = "失败"; dom.statWifi.style.color = "var(--red)";
    dom.statWifi.classList.remove("dim");
    toast("WiFi 连接失败", "err");
    return;
  }
  const bm = txt.match(/bat=(\d+)/i);
  if (bm) {
    S.batPct = +bm[1]; dom.statBat.textContent = S.batPct + "%";
    dom.statBat.classList.remove("dim");
    dom.statBat.style.color = S.batPct < 20 ? "var(--red)" : "";
  }
  const im = txt.match(/ip=([\d.]+)/i);
  if (im) {
    S.ip = im[1]; dom.statIp.textContent = S.ip;
    dom.statIp.classList.remove("dim"); dom.inpIp.value = S.ip;
    updateOtaBtn();
  }
}

// ============ WiFi 操作 ============
const enc = new TextEncoder();
async function writeStr(ch, s) {
  await ch.writeValueWithResponse(enc.encode(s));
}
async function wifiConnect() {
  const ssid = dom.inpSsid.value.trim();
  const psk  = dom.inpPsk.value;
  if (!ssid) { toast("请输入 SSID", "err"); return; }
  try {
    log(`写 SSID=${ssid}`);
    await writeStr(S.chSsid, ssid);
    log("写 PSK (****)");
    await writeStr(S.chPsk, psk);
    log("发送 CMD=C (连接)");
    await writeStr(S.chCmd, "C");
    toast("已发送, 等待设备连接…");
  } catch (e) { log("WiFi 配置失败: " + e.message, "err"); toast("操作失败", "err"); }
}
async function wifiForget() {
  try {
    await writeStr(S.chCmd, "F");
    log("CMD=F (清除 WiFi)", "warn");
    toast("已清除");
  } catch (e) { log(e.message, "err"); }
}
async function deviceReboot() {
  try {
    await writeStr(S.chCmd, "R");
    log("CMD=R (重启)", "warn");
    toast("设备重启中");
  } catch (e) { log(e.message, "err"); }
}

// ============ OTA push ============
async function otaPush() {
  const ip = dom.inpIp.value.trim();
  if (!ip || !S.otaFile) return;
  const url = `http://${ip}/update`;
  log(`推送固件到 ${url} (${S.otaFile.size} bytes)`, "info");
  toast("上传中…");
  dom.btnOtaPush.disabled = true;
  try {
    const xhr = new XMLHttpRequest();
    const form = new FormData();
    form.append("update", S.otaFile, S.otaFile.name);
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded * 100 / e.total);
      dom.otaBar.style.width = pct + "%";
      dom.otaPctText.textContent = pct + "%";
      dom.otaSizeText.textContent = `${(e.loaded/1024).toFixed(0)} / ${(e.total/1024).toFixed(0)} KB`;
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        log("上传完成, 设备应自动重启", "ok");
        toast("OTA 完成, 设备重启", "ok");
      } else {
        log(`HTTP ${xhr.status}: ${xhr.responseText}`, "err");
        toast("OTA 失败 HTTP " + xhr.status, "err");
      }
      dom.btnOtaPush.disabled = false;
    };
    xhr.onerror = () => {
      log("网络错误 (检查 IP 与设备在同一 WiFi)", "err");
      toast("网络错误", "err");
      dom.btnOtaPush.disabled = false;
    };
    xhr.open("POST", url, true);
    xhr.send(form);
  } catch (e) { log(e.message, "err"); dom.btnOtaPush.disabled = false; }
}

// ============ Bind events ============
dom.btnConnect.onclick = connect;
dom.btnDisconnect.onclick = disconnect;
dom.btnWifiConnect.onclick = wifiConnect;
dom.btnWifiForget.onclick = wifiForget;
dom.btnReboot.onclick = deviceReboot;
dom.btnOtaPush.onclick = otaPush;
dom.btnLogClear.onclick = () => { dom.logBox.innerHTML = ""; };
dom.inpFile.onchange = (e) => {
  const f = e.target.files[0];
  S.otaFile = f || null;
  dom.fileName.textContent = f ? `${f.name} · ${(f.size/1024).toFixed(0)} KB` : "";
  dom.fileLabel.textContent = f ? "重新选择…" : "选择文件…";
  updateOtaBtn();
};
dom.inpIp.oninput = updateOtaBtn;

// 初始
setConn("offline", "未连接");
log("DiveWatch App 就绪");
if (!navigator.bluetooth) log("⚠ 浏览器不支持 Web Bluetooth", "warn");

// PWA service worker (可选)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
